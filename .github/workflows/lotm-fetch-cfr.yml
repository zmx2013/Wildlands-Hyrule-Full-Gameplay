name: LOTM Fetch Decompilers
on:
  push:
    branches: [ lotm-tools-temp ]
jobs:
  fetch-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download CFR and Vineflower
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/decompilers
          curl -fL --retry 5 -o /tmp/decompilers/cfr-0.152.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          curl -fL --retry 5 -o /tmp/decompilers/vineflower-1.11.1.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          java -jar /tmp/decompilers/cfr-0.152.jar --version
          java -jar /tmp/decompilers/vineflower-1.11.1.jar --help >/dev/null
          sha256sum /tmp/decompilers/*.jar
      - name: Upload decompilers
        uses: actions/upload-artifact@v4
        with:
          name: lotm-decompilers
          path: /tmp/decompilers
          retention-days: 1
