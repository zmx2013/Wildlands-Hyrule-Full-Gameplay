name: Build PCL2 dependency lock

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_pcl2_lock.py'
      - '.github/workflows/build-pcl2-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve Modrinth dependencies and verify every download
        run: python tools/build_pcl2_lock.py

      - name: Install NeoForge 21.1.233 dedicated server
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/server
          cd build/server
          curl -fL --retry 5 -o neoforge-installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.233/neoforge-21.1.233-installer.jar
          java -jar neoforge-installer.jar --installServer
          echo 'eula=true' > eula.txt
          mkdir -p mods kubejs/startup_scripts kubejs/server_scripts config

      - name: Assemble server-compatible mod set and Wildlands scripts
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          lock=json.loads(Path('build/pcl2/modset-lock.json').read_text())
          src=Path('build/pcl2/downloads'); dst=Path('build/server/mods')
          for m in lock['mods']:
              if m.get('server_side') != 'unsupported':
                  shutil.copy2(src/m['filename'], dst/m['filename'])
          PY
          cp -f src/kubejs/startup_scripts/*.js build/server/kubejs/startup_scripts/ || true
          cp -f src/kubejs/server_scripts/*.js build/server/kubejs/server_scripts/ || true
          cp -f src/config/* build/server/config/ || true

      - name: NeoForge server smoke test
        shell: bash
        run: |
          set -euxo pipefail
          cd build/server
          set +e
          timeout 150s java @user_jvm_args.txt @libraries/net/neoforged/neoforge/21.1.233/unix_args.txt nogui > server-smoke.log 2>&1
          code=$?
          set -e
          cat server-smoke.log
          if grep -Eiq 'Mod loading has failed|Failed to load|Exception in thread "main"|Could not load|Errors during KubeJS startup' server-smoke.log; then
            echo 'Smoke test found fatal mod/KubeJS loading errors' >&2
            exit 1
          fi
          if ! grep -Eiq 'Done \(|For help, type|Dedicated server took' server-smoke.log; then
            echo "Server did not reach ready state (timeout code=$code)" >&2
            exit 1
          fi
          echo 'NEOFORGE SERVER SMOKE TEST PASS'

      - name: Write smoke-test report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('build/pcl2/modset-lock.json').read_text())
          report={
            'minecraft':'1.21.1','neoforge':'21.1.233','resolved_mod_files':len(lock['mods']),
            'missing_optional':lock['missing_optional'],'download_hash_verification':'PASS',
            'neoforge_dedicated_server_smoke_test':'PASS'
          }
          Path('build/pcl2/SMOKE_TEST_REPORT.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wildlands-pcl2-resolved-lock
          path: |
            build/pcl2/resolved-modrinth-files.json
            build/pcl2/modset-lock.json
            build/pcl2/SMOKE_TEST_REPORT.json
            build/server/server-smoke.log
          if-no-files-found: error
          retention-days: 7
